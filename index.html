<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>羊2孵蛋数据</title>
    <style>
        :root {
            --dark-header: #1e293b;
            --orange-bg: #ffedd5; --orange-text: #9a3412; 
            --purple-bg: #f3e8ff; --purple-text: #6b21a8; 
            --blue-bg: #dbeafe; --blue-text: #1e40af; 
            --reset-red: #ef4444;
            --tab-active-bg: #1e293b; 
        }

        /* 整体居中布局 */
        body { 
            font-family: 'PingFang SC', system-ui, sans-serif; 
            background-color: #f8fafc; 
            margin: 0; 
            display: flex; 
            justify-content: center; /* 水平居中核心 */
            align-items: flex-start; 
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container { 
            width: 100%; 
            max-width: 900px; /* 适当缩小最大宽度，让表格更紧凑居中 */
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            text-align: center; /* 确保标题和控制栏文字居中 */
        }

        h2 { color: #1e293b; margin: 0 0 25px 0; font-weight: 700; }

        /* 控制栏居中 */
        .controls-bar { 
            display: flex; 
            justify-content: center; /* 控制栏内部组件居中 */
            align-items: center; 
            flex-wrap: wrap;
            background: #ffffff; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #e2e8f0; 
            gap: 15px;
        }

        .tabs-wrapper { display: flex; gap: 8px; background: #f1f5f9; padding: 4px; border-radius: 10px; }
        .tab-btn {
            padding: 8px 20px; border: none; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 14px; background: transparent; color: #475569; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--tab-active-bg); color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        .column-toggle { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .toggle-item {
            display: flex; align-items: center; background: #f8fafc; padding: 5px 10px;
            border-radius: 6px; border: 1px solid #e2e8f0; cursor: pointer; font-size: 13px;
        }
        .toggle-item input { margin-right: 5px; }

        .btn-reset {
            background-color: var(--reset-red); color: white; border: none; padding: 8px 16px;
            border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
        }

        /* 表格容器及样式 */
        .table-container { 
            width: 100%; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            overflow: hidden; 
            display: flex;
            justify-content: center; /* 确保表格在容器内也倾向居中 */
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: auto; /* 改为自动布局，让列宽自适应内容，视觉上更居中 */
        }
        
        th, td { 
            text-align: center !important; /* 强制所有单元格内容居中 */
            padding: 14px 12px; 
            vertical-align: middle; 
            white-space: nowrap; 
        }

        th { background: var(--dark-header); color: #ffffff; cursor: pointer; font-size: 14px; }
        td { border-bottom: 1px solid #f1f5f9; color: #475569; }

        /* 名称列改为居中 */
        .name-cell { 
            font-weight: 700; 
            text-align: center !important; 
            padding-left: 12px !important; 
        }

        .bg-orange { background-color: var(--orange-bg) !important; color: var(--orange-text) !important; }
        .bg-purple { background-color: var(--purple-bg) !important; color: var(--purple-text) !important; }
        .bg-blue   { background-color: var(--blue-bg) !important; color: var(--blue-text) !important; }

        .tag { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; }
        .tag-卖 { background: #fee2e2; color: #dc2626; }
        .tag-喂 { background: #dcfce7; color: #16a34a; }
        .tag-按需选择 { background: #fef9c3; color: #a16207; }

        .hidden { display: none !important; }

        /* 手机端适配 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 12px; border-radius: 10px; }
            .controls-bar { flex-direction: column; padding: 10px; gap: 10px; }
            .column-toggle { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }
            .toggle-item { padding: 5px 2px; font-size: 11px; justify-content: center; }
            .tabs-wrapper, .btn-reset { width: 100%; }
            .name-cell { padding-left: 0 !important; }
            th, td { padding: 10px 4px; }
        }
    </style>
</head>
<body>

        <div class="column-toggle" id="toggleContainer">

            <tbody id="tableBody"></tbody>

</div>

    function switchTab(tab, btn) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCurrentTable();
    }

    function resetDefaults() {
        const checkboxes = document.querySelectorAll('#toggleContainer input');
        checkboxes.forEach(cb => {
            const idx = parseInt(cb.getAttribute('data-index'));
            cb.checked = (idx === 2 || idx === 3 || idx === 8);
        });
        renderCurrentTable();
    }

    function applyDynamicScaling() {
        if (window.innerWidth > 768) {
            document.querySelectorAll('th, td').forEach(el => {
                el.style.fontSize = ''; el.style.padding = '';
            });
            return;
        }

        const activeCols = document.querySelectorAll('#toggleContainer input:checked').length + 1;
        let fontSize = 13, padding = 14;

        if (activeCols > 7) { fontSize = 9; padding = 5; }
        else if (activeCols > 5) { fontSize = 10; padding = 8; }
        else if (activeCols > 4) { fontSize = 11; padding = 10; }

        document.querySelectorAll('th, td').forEach(el => {
            el.style.fontSize = fontSize + 'px';
            el.style.paddingTop = padding + 'px';
            el.style.paddingBottom = padding + 'px';
        });
    }

    function renderCurrentTable() {
        const body = document.getElementById('tableBody');
        const items = currentTab === 'monster' ? monsterData : goldData;
        const checkboxes = Array.from(document.querySelectorAll('#toggleContainer input'));
        
        checkboxes.forEach(cb => {
            const idx = cb.getAttribute('data-index');
            document.querySelectorAll(`.col-${idx}`).forEach(el => el.classList.toggle('hidden', !cb.checked));
        });

        body.innerHTML = items.map(item => `
            <tr>
                <td class="name-cell bg-${item.group}">${item.name}</td>
                <td class="col-1 ${!checkboxes[0].checked ? 'hidden' : ''}">${item.time}s</td>
                <td class="col-2 ${!checkboxes[1].checked ? 'hidden' : ''}">${item.gold}</td>
                <td class="col-3 ${!checkboxes[2].checked ? 'hidden' : ''}">${item.exp}</td>
                <td class="col-4 ${!checkboxes[3].checked ? 'hidden' : ''}">${item.goldMin}</td>
                <td class="col-5 ${!checkboxes[4].checked ? 'hidden' : ''}">${item.expMin}</td>
                <td class="col-6 ${!checkboxes[5].checked ? 'hidden' : ''}">${item.goldEff}</td>
                <td class="col-7 ${!checkboxes[6].checked ? 'hidden' : ''}">${item.expEff}</td>
                <td class="col-8 ${!checkboxes[7].checked ? 'hidden' : ''}"><span class="tag tag-${item.priority}">${item.priority}</span></td>
            </tr>
        `).join('');
        
        applyDynamicScaling();
    }

    function sortTable(n) {
        const table = document.getElementById("dataTable");
        let dir = "asc", switching = true, switchcount = 0;
        while (switching) {
            switching = false;
            let rows = table.rows;
            for (var i = 1; i < (rows.length - 1); i++) {
                var shouldSwitch = false;
                var x = rows[i].getElementsByTagName("TD")[n];
                var y = rows[i + 1].getElementsByTagName("TD")[n];
                let xVal = isNaN(parseFloat(x.innerText)) ? x.innerText.toLowerCase() : parseFloat(x.innerText.replace(/s|,/g,''));
                let yVal = isNaN(parseFloat(y.innerText)) ? y.innerText.toLowerCase() : parseFloat(y.innerText.replace(/s|,/g,''));
                if ((dir === "asc" && xVal > yVal) || (dir === "desc" && xVal < yVal)) {
                    shouldSwitch = true; break;
                }
            }
            if (shouldSwitch) {
                rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                switching = true;
                switchcount++;
            } else if (switchcount === 0 && dir === "asc") {
                dir = "desc"; switching = true;
            }
        }
    }

    window.onload = renderCurrentTable;
    window.onresize = applyDynamicScaling;
</script>

</body>
</html>
